rules:
  invoice:
    keywords:
      - invoice
      - bill
      - payment
      - amount
      - total
      - due date
      - invoice number
    metadata_fields:
      - invoice_number
      - date
      - total_amount
      - due_date

  contract:
    keywords:
      - agreement
      - contract
      - terms
      - parties
      - hereby
      - obligations
    metadata_fields:
      - contract_id
      - parties
      - effective_date
      - expiration_date

  report:
    keywords:
      - report
      - analysis
      - summary
      - findings
      - conclusion
      - recommendations
    metadata_fields:
      - report_type
      - period
      - author
      - date

extraction_patterns:
  invoice_number: '(?i)(?:invoice|bill)(?:\s+(?:no|number|#)?[:.\s]*)([\w-]+)'
  date: '(?:\d{2}[-/]\d{2}[-/]\d{4})|(?:\w+\s+\d{1,2},?\s+\d{4})'
  total_amount: '(?i)(?:total|amount|sum)[\s:]*[$€£]?\s*([\d,]+\.?\d*)'
  due_date: '(?i)due\s+(?:date|by)?[\s:]*(\d{2}[-/]\d{2}[-/]\d{4})'
  contract_id: '(?i)(?:contract|agreement)(?:\s+(?:no|number|#)?[:.\s]*)([\w-]+)'
  effective_date: '(?i)effective\s+date[\s:]*(\d{2}[-/]\d{2}[-/]\d{4})'
  expiration_date: '(?i)(?:expiration|termination)\s+date[\s:]*(\d{2}[-/]\d{2}[-/]\d{4})'