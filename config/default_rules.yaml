rules:
  invoice:
    keywords:
      - invoice
      - bill
      - payment
    metadata_fields:
      - invoice_number
      - date
      - total_amount

  contract:
    keywords:
      - agreement
      - contract
      - terms
    metadata_fields:
      - contract_id
      - parties
      - effective_date

  report:
    keywords:
      - report
      - analysis
      - summary
    metadata_fields:
      - report_type
      - period
      - author

extraction_patterns:
  invoice_number: '[A-Z]{2,}\d{4,}'
  date: '\d{2}[-/]\d{2}[-/]\d{4}'
  total_amount: '\$?\s*\d+([.,]\d{2})?'
  contract_id: 'C[A-Z0-9]{6,}'
