version: 1
formatters:
  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: ERROR  # Always show errors
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    level: DEBUG  # Always capture all logs in file
    formatter: standard
    filename: docflow.log
loggers:
  docflow:
    level: ERROR  # Base level, will be updated to DEBUG with --verbose
    handlers: [console, file]
    propagate: no
  docflow.processor:
    level: ERROR  # Base level, will be updated to DEBUG with --verbose
    handlers: [console, file]
    propagate: no
  docflow.models:
    level: ERROR  # Base level, will be updated to DEBUG with --verbose
    handlers: [console, file]
    propagate: no
root:
  level: ERROR  # Only show errors by default
  handlers: [console]